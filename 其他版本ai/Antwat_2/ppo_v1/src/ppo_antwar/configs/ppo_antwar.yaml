# 输出根目录（可选）
# 建议使用绝对路径，或设置环境变量 PPO_OUTPUT_DIR
# 如果不设置，PathConfig 会自动解析为项目根目录下的 outputs/
# base_dir: "./outputs"

# 路径配置
path:
  baselines_dir: null
  sdk_dir: null

ppo:
  lr: 0.00005
  lr_vf: 0.000025
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.15
  clip_eps_vf: 0.2
  ent_coef: 0.2
  exploration_epsilon: 0.05
  logit_noise_std: 0.2
  vf_coef: 0.25
  max_grad_norm: 0.5
  max_grad_norm_vf: 5000.0
  ppo_epochs: 2
  batch_size: 1024
  lr_cosine_decay: true
  enable_auxiliary: true
  aux_tower_coef: 0.02
  aux_gold_coef: 0.002
  aux_enemy_tower_coef: 0.02
  aux_enemy_gold_coef: 0.002
  # 数值安全边界
  clip_values:
    logits_min: -20
    logits_max: 20
    values_min: -200
    values_max: 200
    returns_min: -1e6
    returns_max: 1e6
    advantages_min: -1e4
    advantages_max: 1e4
    prob_min: 1e-10
    ratio_min: 1e-5
    ratio_max: 10.0
    loss_max: 1e6
    nan_threshold: 5

training:
  total_episodes: 2000
  save_interval: 10
  opponent_update_interval: 40
  n_envs: 20
  battle_interval: 20
  n_battles: 8
  max_steps_per_episode: 512

selfplay:
  opponent_pool_size: 10
  min_opponent_games: 8
  exploit_prob: 0.7
  baseline_agents:
    - BasicTowerAI
    - BasicRandomAI
    - sample
    - MediumRuleAI
    - nn_gen_32_cuda

league:
  decay: 0.99
  min_win_rate_games: 8

network:
  hidden_dim: 256
  board_shape:
    - 28
    - 19
    - 19
  global_dim: 33
  action_dim: 96

env:
  player_id: 0
  backend_type: 'python'
  prefer_native: false

system:
  device: 'cuda'
  seed: 42
