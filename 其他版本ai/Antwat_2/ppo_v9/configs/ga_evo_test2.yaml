# ============================================================
# GA 进化训练 - 测试配置 v2
# 种群规模翻倍，开启 Baseline battle，debug 日志
# ============================================================

system:
  device: "cuda"
  seed: 42

network:
  hidden_dim: 256
  enable_auxiliary: true

# 种群规模翻倍：8个体，2代
evolution:
  max_generations: 2
  population_size: 8
  num_seeds: 4
  elitism_count: 2
  convergence_window: 100
  convergence_threshold: 5.0

crossover:
  method: "layer_wise"
  rate: 0.8

mutation:
  method: "gaussian"
  rate: 0.1
  scale: 0.03
  decay: 0.99

selection:
  method: "fixed_reference_elo"
  anchor_references:
    - "BasicRandomAI"
    - "BasicTowerAI"
  dynamic_references: 0
  include_previous_champion: false
  elo_k_factor: 64
  elo_initial: 1200

opponent_pool:
  max_size: 10
  min_games_threshold: 2
  exploit_prob: 0.7
  decay: 0.99
  min_win_rate_games: 2

# 开启基线验证
baseline_battle:
  enabled: true
  interval: 1
  n_battles: 2

env:
  player_id: 0
  backend_type: "python"
  max_steps: 512

# debug 级别，可看到回合级日志
logging:
  log_level: "DEBUG"
  save_interval: 1
  tensorboard: false
